<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flores para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3a2436;
    --ink-soft:#7a5c6c;
    --paper:#fbf5f2;
    --parchment:#f2e8d8;
    --parchment-edge:#d9c39a;
    --note-card:#fffaf1;
    --gold:#c9a15a;
    --gold-deep:#a67d3d;
    --sage:#7c9473;
    --sage-deep:#54684d;
    --night-a:#100c26;
    --night-b:#2b1a3d;
    --night-c:#4a2545;
    --star:#fdf6e3;
    --rose-color:#f091b3;
    --shadow:0 10px 30px -12px rgba(58,36,54,.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Jost',sans-serif;
    color:var(--ink);
    background:radial-gradient(circle at 50% -10%, #fffaf7, var(--paper) 55%);
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,.serif{font-family:'Cormorant Garamond',serif;}
  .hand{font-family:'Caveat',cursive;}
  button,input{font-family:inherit;}
  ::selection{background:var(--rose-color); color:#fff;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }

  /* ---------- LOGIN ---------- */
  #login-screen{
    position:fixed; inset:0;
    background:linear-gradient(160deg,var(--night-a),var(--night-b) 55%,var(--night-c));
    display:flex; align-items:center; justify-content:center;
    z-index:100; overflow:hidden;
    transition:opacity .9s ease, transform .9s ease;
  }
  #login-screen.leaving{opacity:0; transform:scale(1.04); pointer-events:none;}
  #stars-canvas{position:absolute; inset:0; width:100%; height:100%;}
  .login-card{
    position:relative; z-index:2;
    width:min(90vw,380px);
    padding:44px 36px 36px;
    text-align:center;
    background:rgba(20,14,36,.35);
    border:1px solid rgba(201,161,90,.5);
    border-radius:18px;
    backdrop-filter:blur(6px);
    box-shadow:0 20px 60px -20px rgba(0,0,0,.6);
    animation:cardIn 1.1s ease both;
  }
  @keyframes cardIn{from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);}}
  .login-mark{color:var(--gold); font-size:1.5rem; letter-spacing:.35em; display:block; margin:0 0 10px -0.35em;}
  .login-card h1{color:var(--star); font-size:1.9rem; font-weight:500; font-style:italic; margin:0 0 6px;}
  .login-card p{color:#cfc6df; font-size:.85rem; margin:0 0 26px; letter-spacing:.02em;}
  .login-card input{
    width:100%; background:transparent; border:none; border-bottom:1px solid rgba(201,161,90,.6);
    color:var(--star); font-size:1.1rem; text-align:center; padding:8px 4px; outline:none;
    transition:border-color .3s;
  }
  .login-card input::placeholder{color:#8d84a8;}
  .login-card input:focus{border-color:var(--gold);}
  .login-card .hint{min-height:18px; font-size:.75rem; color:#e6a3b8; margin-top:8px; opacity:0; transition:opacity .3s;}
  .login-card .hint.show{opacity:1;}
  .login-card button{
    margin-top:26px; padding:11px 30px; border-radius:999px; border:1px solid var(--gold);
    background:transparent; color:var(--gold); font-size:.8rem; letter-spacing:.18em; text-transform:uppercase;
    cursor:pointer; transition:background .3s,color .3s,transform .3s;
  }
  .login-card button:hover{background:var(--gold); color:var(--night-a); transform:translateY(-2px);}
  .login-card button:focus-visible{outline:2px solid var(--star); outline-offset:3px;}

  /* ---------- MAIN SITE ---------- */
  #main-site{opacity:0; transition:opacity .8s ease .1s;}
  #main-site.entering{opacity:1;}
  #main-site[hidden]{display:none;}

  .petals-bg{position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none;}
  .falling-petal{position:absolute; top:-5%; background:var(--rose-color); opacity:.3; border-radius:0 100% 0 100%; animation:drift linear infinite;}
  @keyframes drift{
    0%{transform:translateY(0) rotate(0deg);}
    100%{transform:translateY(115vh) rotate(300deg);}
  }

  .top-menu{
    position:sticky; top:0; z-index:20;
    background:rgba(251,245,242,.9); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--parchment-edge);
    padding:16px 28px;
  }
  .top-menu-inner{max-width:1400px; margin:0 auto; display:flex; align-items:baseline; justify-content:space-between; gap:24px; flex-wrap:wrap;}
  .brand{font-size:1.5rem; font-style:italic; font-weight:500;}
  .brand .mark{color:var(--gold); font-style:normal; margin-right:6px;}
  nav.flower-menu{display:flex; gap:22px; overflow-x:auto; padding-bottom:2px; max-width:100%;}
  nav.flower-menu button{
    background:none; border:none; cursor:pointer; padding:6px 2px; white-space:nowrap;
    font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft);
    border-bottom:2px solid transparent; transition:color .25s, border-color .25s;
  }
  nav.flower-menu button:hover{color:var(--ink);}
  nav.flower-menu button.active{color:var(--ink); border-color:var(--gold);}

  .layout{position:relative; z-index:1; max-width:1400px; margin:0 auto; padding:30px 28px 60px; display:grid; grid-template-columns:250px 1fr 270px; gap:26px; align-items:start;}

  .panel{border-radius:14px; padding:26px 24px; box-shadow:var(--shadow);}
  .panel-left{background:var(--parchment); border:1px solid var(--parchment-edge); position:relative;}
  .panel-left::before{content:"";position:absolute; inset:6px; border:1px solid rgba(201,161,90,.35); border-radius:9px; pointer-events:none;}
  .eyebrow{font-size:.68rem; letter-spacing:.22em; text-transform:uppercase; color:var(--gold-deep); margin:0 0 16px;}
  .verse-wrap{min-height:190px; position:relative;}
  .verse{font-family:'Cormorant Garamond',serif; font-size:1.15rem; line-height:1.5; color:var(--ink); opacity:0; transition:opacity .5s ease;}
  .verse.show{opacity:1;}
  .verse p{margin:0;}
  .verse::first-letter{font-size:2.5rem; color:var(--gold-deep); float:left; line-height:.75; padding:4px 8px 0 0; font-weight:600;}
  .verse .ref{display:block; margin-top:14px; font-family:'Jost',sans-serif; font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-deep); opacity:.85;}

  .panel-right{background:transparent; box-shadow:none; padding:0; display:flex; flex-direction:column; align-items:center;}
  .panel-right .eyebrow{width:100%; text-align:center;}
  .note-stack{position:relative; width:100%; min-height:230px;}
  .note-card{
    position:absolute; inset:0; background:var(--note-card); border-radius:4px 4px 30px 4px;
    box-shadow:0 14px 26px -14px rgba(58,36,54,.35); padding:30px 22px 26px;
    transform:rotate(-1.5deg); transition:opacity .4s ease, transform .4s ease;
    cursor:pointer;
  }
  .note-card::before{
    content:""; position:absolute; top:-10px; left:50%; transform:translateX(-50%) rotate(-3deg);
    width:70px; height:22px; background:rgba(201,161,90,.35); border:1px solid rgba(201,161,90,.5);
  }
  .note-card p{font-family:'Caveat',cursive; font-size:1.5rem; line-height:1.35; color:var(--ink); margin:0;}
  .note-card .tap-hint{position:absolute; bottom:12px; right:18px; font-family:'Jost',sans-serif; font-size:.6rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); opacity:.55;}

  .stage{display:flex; flex-direction:column; align-items:center; padding-top:6px;}
  .tone-control{width:100%; max-width:420px; text-align:center; margin-bottom:14px;}
  .tone-name{font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.15rem; color:var(--ink); min-height:1.6em;}
  input[type=range].tone-slider{
    -webkit-appearance:none; appearance:none; width:100%; height:10px; border-radius:999px; margin:10px 0 6px;
    background:linear-gradient(90deg,#fbe4ea,#f6c6d6,#f091b3,#e8688f,#c94577,#9c2d63);
    outline:none;
  }
  input[type=range].tone-slider::-webkit-slider-thumb{
    -webkit-appearance:none; width:22px; height:22px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--rose-color) 65%);
    border:2px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.25); cursor:pointer;
  }
  input[type=range].tone-slider::-moz-range-thumb{
    width:22px; height:22px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--rose-color) 65%);
    border:2px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.25); cursor:pointer;
  }
  .swatches{display:flex; justify-content:center; gap:10px; margin-top:6px;}
  .swatch{width:18px; height:18px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px rgba(58,36,54,.2); cursor:pointer; transition:transform .2s;}
  .swatch:hover{transform:scale(1.15);}

  .bouquet{display:flex; align-items:flex-end; justify-content:center; min-height:400px; width:100%; position:relative;}
  .bloom-wrap{width:170px; margin:0 -18px; opacity:1; transition:opacity .6s ease;}
  .bloom-wrap.enter{opacity:0;}
  .swayer{display:block; transform-origin:50% 94%;}
  .swayer.swaying{animation-name:sway; animation-timing-function:ease-in-out; animation-iteration-count:infinite; animation-direction:alternate;}
  @keyframes sway{from{transform:rotate(-2.4deg);} to{transform:rotate(2.6deg);}}
  .bloom-wrap svg{width:100%; height:auto; display:block; overflow:visible;}
  .petal{fill:var(--rose-color); transition:fill .35s ease;}
  .petal.l-outer{filter:brightness(1.1) saturate(1.03);}
  .petal.l-mid{filter:brightness(1);}
  .petal.l-inner{filter:brightness(.85);}
  .petal.lip{filter:brightness(.68) saturate(1.15);}
  .leaf{fill:var(--sage);}
  .stem{stroke:var(--sage-deep); stroke-width:3.4; fill:none; stroke-linecap:round;}
  .center-dot{fill:var(--gold);}
  .center-hl{fill:#fff8e8; opacity:.55;}
  .stamen{stroke:var(--gold-deep); stroke-width:1.6; stroke-linecap:round;}

  .type-caption{margin-top:16px; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.3rem; color:var(--ink-soft);}

  footer{text-align:center; padding:30px 20px 50px; font-size:.75rem; letter-spacing:.06em; color:var(--ink-soft);}
  footer .heart{color:var(--rose-color);}

  @media (max-width:980px){
    .layout{grid-template-columns:1fr;}
    .panel-left{order:2;}
    .stage{order:1;}
    .panel-right{order:3; margin-top:6px;}
    .bloom-wrap{width:130px;}
  }
</style>
</head>
<body>

  <div id="login-screen">
    <canvas id="stars-canvas"></canvas>
    <form class="login-card" id="loginForm" autocomplete="off">
      <span class="login-mark">✦</span>
      <h1>¿Cómo te llamas?</h1>
      <p>Antes de entrar, dime tu nombre.</p>
      <input type="text" id="nameInput" placeholder="Tu nombre" maxlength="30" />
      <div class="hint" id="loginHint">Escribe tu nombre para continuar</div>
      <button type="submit">Entrar ✦</button>
    </form>
  </div>

  <div id="main-site" hidden>
    <div class="petals-bg" id="petalsBg"></div>

    <header class="top-menu">
      <div class="top-menu-inner">
        <div class="brand"><span class="mark">✦</span>Para <span id="greetName">ti</span></div>
        <nav class="flower-menu" id="flowerMenu"></nav>
      </div>
    </header>

    <div class="layout">
      <aside class="panel panel-left">
        <p class="eyebrow">Palabras para quedarte</p>
        <div class="verse-wrap" id="verseWrap"></div>
      </aside>

      <main class="stage">
        <div class="tone-control">
          <p class="eyebrow">Tonos de rosa</p>
          <div class="tone-name" id="toneName">Rosa chicle</div>
          <input type="range" class="tone-slider" id="toneSlider" min="0" max="100" value="40" />
          <div class="swatches" id="swatches"></div>
        </div>
        <div class="bouquet" id="bouquet"></div>
        <div class="type-caption" id="typeCaption">— Rosa —</div>
      </main>

      <aside class="panel-right">
        <p class="eyebrow">Lo que quiero decirte</p>
        <div class="note-stack" id="noteStack"></div>
      </aside>
    </div>

    <footer>hecho con cariño <span class="heart">♥</span> — para regalarte flores de verdad, no solo de pantalla</footer>
  </div>

<script>
(function(){
  "use strict";
  const NS = 'http://www.w3.org/2000/svg';

  /* ---------------- DATA ---------------- */
  const VERSES = [
    {text:"El amor es paciente, el amor es bondadoso.", ref:"1 Corintios 13:4"},
    {text:"Todo tiene su tiempo, y todo lo que se quiere debajo del cielo tiene su hora.", ref:"Eclesiastés 3:1"},
    {text:"Mirad los lirios del campo, y considerad cómo crecen.", ref:"Mateo 6:28"},
    {text:"El Señor es mi pastor, nada me faltará.", ref:"Salmos 23:1"},
    {text:"El amor todo lo espera, todo lo soporta, nunca deja de ser.", ref:"1 Corintios 13:7-8"},
    {text:"Sean agradecidos en toda circunstancia.", ref:"1 Tesalonicenses 5:18"},
    {text:"Mejor es lo poco con amor, que un tesoro grande sin él.", ref:"inspirado en Proverbios 15:16"},
    {text:"Donde hay amor verdadero, hay paciencia y hay luz.", ref:"inspirado en 1 Juan 4:7"},
    {text:"Como las flores del campo florecen, florece también el corazón agradecido.", ref:"inspirado en Salmos 103:15"},
    {text:"Da gracias, ama despacio, y todo lo demás llega a su tiempo.", ref:"palabras propias"}
  ];

  const NOTES_TEMPLATE = [
    "Para ti, {name}: estas flores son solo una muestra de las reales que quiero darte.",
    "Cada tipo que ves aquí, quiero regalártelo en persona, no solo en una pantalla.",
    "Esto es apenas el comienzo de lo que quiero darte.",
    "Elige tu favorita — te la traigo pronto, te lo prometo.",
    "No hice esta página para impresionarte, la hice para decirte algo simple: mereces flores de verdad.",
    "Un ramo virtual hoy, uno real muy pronto.",
    "Gracias por darme la oportunidad de sorprenderte.",
    "Esto no es solo una página, es una promesa pequeña."
  ];

  const TONE_STOPS = [
    {p:0,  name:'Rosa palo',        hex:'#fbe4ea'},
    {p:20, name:'Rosa cuarzo',      hex:'#f6c6d6'},
    {p:40, name:'Rosa chicle',      hex:'#f091b3'},
    {p:60, name:'Rosa coral',       hex:'#e8688f'},
    {p:80, name:'Fucsia',           hex:'#c94577'},
    {p:100,name:'Magenta intenso',  hex:'#9c2d63'}
  ];

  const FLOWER_TYPES = [
    {id:'rosa', name:'Rosa', layers:[
      {count:6, length:13, width:9,  radius:2, curl:1, brightness:'inner'},
      {count:8, length:21, width:14, radius:3, curl:2, brightness:'mid'},
      {count:9, length:29, width:18, radius:5, curl:4, brightness:'outer', jitter:6}
    ], center:{r:5}},
    {id:'tulipan', name:'Tulipán', layers:[
      {count:6, length:36, width:17, radius:3, curl:2, brightness:'mid'}
    ], center:{r:5}},
    {id:'margarita', name:'Margarita', layers:[
      {count:18, length:29, width:6, radius:4, curl:0, brightness:'mid'}
    ], center:{r:8, type:'textured'}},
    {id:'peonia', name:'Peonía', layers:[
      {count:8, length:19, width:15, radius:3, curl:3, brightness:'inner'},
      {count:8, length:26, width:18, radius:5, curl:4, brightness:'mid', jitter:8},
      {count:9, length:32, width:20, radius:7, curl:5, brightness:'outer', jitter:10}
    ], center:{r:4}},
    {id:'orquidea', name:'Orquídea', layers:[
      {count:5, length:25, width:11, radius:3, curl:2, brightness:'mid'}
    ], lip:{length:31, width:19, curl:6}, center:{r:3, type:'stamens', count:3, stamenLength:6}},
    {id:'lirio', name:'Lirio', layers:[
      {count:6, length:45, width:10, radius:4, curl:0, brightness:'mid'}
    ], center:{r:2, type:'stamens', count:6, stamenLength:9}},
    {id:'clavel', name:'Clavel', layers:[
      {count:26, length:14, width:7, radius:3, curl:0, brightness:'mid', jitter:14}
    ], center:{r:4}},
    {id:'hortensia', name:'Hortensia', cluster:true, miniLayers:[
      {count:4, length:8, width:6, radius:1, curl:0, brightness:'mid'}
    ], center:{r:1.4}}
  ];

  /* ---------------- STATE ---------------- */
  let currentType = FLOWER_TYPES[0];
  let userName = '';
  let verseIndex = 0;
  let noteIndex = 0;
  let notesArr = [];
  let mainInitialized = false;
  let noteTimerId = null;

  /* ---------------- COLOR HELPERS ---------------- */
  function hexToRgb(hex){
    const h = hex.replace('#','');
    return {r:parseInt(h.slice(0,2),16), g:parseInt(h.slice(2,4),16), b:parseInt(h.slice(4,6),16)};
  }
  function rgbToHex(r,g,b){
    return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
  }
  function hexLerp(a,b,t){
    const pa = hexToRgb(a), pb = hexToRgb(b);
    return rgbToHex(
      Math.round(pa.r + (pb.r-pa.r)*t),
      Math.round(pa.g + (pb.g-pa.g)*t),
      Math.round(pa.b + (pb.b-pa.b)*t)
    );
  }
  function colorAndNameFromValue(v){
    let lo = TONE_STOPS[0], hi = TONE_STOPS[TONE_STOPS.length-1];
    for(let i=0;i<TONE_STOPS.length-1;i++){
      if(v >= TONE_STOPS[i].p && v <= TONE_STOPS[i+1].p){ lo = TONE_STOPS[i]; hi = TONE_STOPS[i+1]; break; }
    }
    const t = hi.p===lo.p ? 0 : (v-lo.p)/(hi.p-lo.p);
    return {hex: hexLerp(lo.hex, hi.hex, t), name: t<0.5 ? lo.name : hi.name};
  }
  function applyTone(v){
    const {hex,name} = colorAndNameFromValue(v);
    document.documentElement.style.setProperty('--rose-color', hex);
    const toneNameEl = document.getElementById('toneName');
    if(toneNameEl) toneNameEl.textContent = name;
  }

  /* ---------------- FLOWER SVG BUILDER ---------------- */
  function petalPath(len,wid,curl){
    curl = curl || 0;
    return 'M0,0 Q' + (-wid/2).toFixed(1) + ',' + (-len*0.42).toFixed(1) + ' ' + curl.toFixed(1) + ',' + (-len).toFixed(1) +
           ' Q' + (wid/2+curl).toFixed(1) + ',' + (-len*0.42).toFixed(1) + ' 0,0 Z';
  }
  function makeLayer(group, cfg){
    const count = cfg.count, step = 360/count;
    const jitter = cfg.jitter || 0;
    for(let i=0;i<count;i++){
      const angle = step*i + (jitter ? (Math.random()-0.5)*jitter : 0);
      const g = document.createElementNS(NS,'g');
      g.setAttribute('transform', 'rotate(' + angle.toFixed(2) + ') translate(0,' + (-cfg.radius) + ')');
      const path = document.createElementNS(NS,'path');
      path.setAttribute('d', petalPath(cfg.length, cfg.width, cfg.curl));
      path.setAttribute('class', 'petal l-' + (cfg.brightness || 'mid'));
      g.appendChild(path);
      group.appendChild(g);
    }
  }
  function addCenter(group, c){
    const r = c.r;
    const dot = document.createElementNS(NS,'circle');
    dot.setAttribute('r', r); dot.setAttribute('class','center-dot');
    group.appendChild(dot);
    const hl = document.createElementNS(NS,'circle');
    hl.setAttribute('r', r*0.4); hl.setAttribute('cx', -r*0.25); hl.setAttribute('cy', -r*0.25);
    hl.setAttribute('class','center-hl');
    group.appendChild(hl);
    if(c.type === 'textured'){
      for(let i=0;i<7;i++){
        const a = Math.random()*Math.PI*2, rr = Math.random()*r*0.7;
        const dt = document.createElementNS(NS,'circle');
        dt.setAttribute('cx', (Math.cos(a)*rr).toFixed(1));
        dt.setAttribute('cy', (Math.sin(a)*rr).toFixed(1));
        dt.setAttribute('r', 0.7);
        dt.setAttribute('fill', 'var(--gold-deep)');
        dt.setAttribute('opacity', '.5');
        group.appendChild(dt);
      }
    }
    if(c.type === 'stamens'){
      const n = c.count, sl = c.stamenLength;
      for(let i=0;i<n;i++){
        const angle = (360/n)*i;
        const line = document.createElementNS(NS,'line');
        line.setAttribute('x1',0); line.setAttribute('y1',0);
        line.setAttribute('x2',0); line.setAttribute('y2', -sl);
        line.setAttribute('class','stamen');
        line.setAttribute('transform','rotate(' + angle + ')');
        group.appendChild(line);
      }
    }
  }
  function buildFlowerSVG(type){
    const svg = document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','-65 -55 130 155');

    const stem = document.createElementNS(NS,'path');
    stem.setAttribute('d','M0,0 C -5,22 5,42 0,92');
    stem.setAttribute('class','stem');
    svg.appendChild(stem);

    [{y:38, rot:-32, sc:1},{y:64, rot:26, sc:-1}].forEach(function(lc){
      const lg = document.createElementNS(NS,'g');
      lg.setAttribute('transform', 'translate(0,' + lc.y + ') rotate(' + lc.rot + ') scale(' + lc.sc + ',1)');
      const lp = document.createElementNS(NS,'path');
      lp.setAttribute('d', petalPath(22,13,3));
      lp.setAttribute('class','leaf');
      lg.appendChild(lp);
      svg.appendChild(lg);
    });

    const bloom = document.createElementNS(NS,'g');
    bloom.setAttribute('class','bloom');

    if(type.cluster){
      const positions = [[0,0],[13,-8],[-13,-8],[13,10],[-13,10],[0,-17],[0,17]];
      positions.forEach(function(pos){
        const mg = document.createElementNS(NS,'g');
        mg.setAttribute('transform','translate(' + pos[0] + ',' + pos[1] + ') scale(0.9)');
        type.miniLayers.forEach(function(lc){ makeLayer(mg, lc); });
        addCenter(mg, type.center);
        bloom.appendChild(mg);
      });
    } else {
      const reversed = type.layers.slice().reverse();
      reversed.forEach(function(lc){ makeLayer(bloom, lc); });
      if(type.lip){
        const lipG = document.createElementNS(NS,'g');
        lipG.setAttribute('transform','rotate(180) translate(0,-3)');
        const lipPath = document.createElementNS(NS,'path');
        lipPath.setAttribute('d', petalPath(type.lip.length, type.lip.width, type.lip.curl));
        lipPath.setAttribute('class','petal lip');
        lipG.appendChild(lipPath);
        bloom.appendChild(lipG);
      }
      addCenter(bloom, type.center);
    }
    svg.appendChild(bloom);
    return svg;
  }

  /* ---------------- BOUQUET RENDER ---------------- */
  function renderBouquet(type){
    const bouquetEl = document.getElementById('bouquet');
    bouquetEl.innerHTML = '';
    const configs = [
      {scale:0.82, dy:18, rot:-6, delay:0},
      {scale:1,    dy:0,  rot:0,  delay:150},
      {scale:0.86, dy:14, rot:7,  delay:300}
    ];
    configs.forEach(function(cfg, i){
      const wrap = document.createElement('div');
      wrap.className = 'bloom-wrap enter';
      wrap.style.transform = 'translateY(' + cfg.dy + 'px) scale(' + cfg.scale + ') rotate(' + cfg.rot + 'deg)';
      wrap.style.zIndex = i===1 ? 2 : 1;

      const swayer = document.createElement('div');
      swayer.className = 'swayer';
      swayer.appendChild(buildFlowerSVG(type));
      wrap.appendChild(swayer);
      bouquetEl.appendChild(wrap);

      setTimeout(function(){
        wrap.classList.remove('enter');
        swayer.classList.add('swaying');
        swayer.style.animationDuration = (4.4 + Math.random()*1.6).toFixed(2) + 's';
        swayer.style.animationDelay = (cfg.delay/1000) + 's';
      }, cfg.delay);
    });
    const caption = document.getElementById('typeCaption');
    if(caption) caption.textContent = '— ' + type.name + ' —';
  }

  /* ---------------- MENU ---------------- */
  function renderMenu(){
    const nav = document.getElementById('flowerMenu');
    nav.innerHTML = '';
    FLOWER_TYPES.forEach(function(type){
      const btn = document.createElement('button');
      btn.textContent = type.name;
      btn.type = 'button';
      if(type.id === currentType.id) btn.classList.add('active');
      btn.addEventListener('click', function(){
        currentType = type;
        Array.prototype.forEach.call(nav.children, function(b){ b.classList.toggle('active', b === btn); });
        renderBouquet(currentType);
      });
      nav.appendChild(btn);
    });
  }

  /* ---------------- TONE CONTROL ---------------- */
  function initToneControl(){
    const slider = document.getElementById('toneSlider');
    slider.addEventListener('input', function(e){ applyTone(+e.target.value); });
    applyTone(+slider.value);
    const sw = document.getElementById('swatches');
    TONE_STOPS.forEach(function(stop){
      const d = document.createElement('div');
      d.className = 'swatch';
      d.style.background = stop.hex;
      d.title = stop.name;
      d.addEventListener('click', function(){ slider.value = stop.p; applyTone(stop.p); });
      sw.appendChild(d);
    });
  }

  /* ---------------- FALLING PETALS BG ---------------- */
  function initPetalsBg(){
    const el = document.getElementById('petalsBg');
    for(let i=0;i<16;i++){
      const p = document.createElement('div');
      p.className = 'falling-petal';
      p.style.left = (Math.random()*100) + '%';
      const dur = 9 + Math.random()*9;
      p.style.animationDuration = dur + 's';
      p.style.animationDelay = (-Math.random()*dur) + 's';
      const size = 8 + Math.random()*8;
      p.style.width = size + 'px';
      p.style.height = (size*1.4) + 'px';
      el.appendChild(p);
    }
  }

  /* ---------------- VERSES (LEFT PANEL) ---------------- */
  function renderVerseInto(el, v){
    el.innerHTML = '';
    const p = document.createElement('p');
    p.textContent = v.text;
    const ref = document.createElement('span');
    ref.className = 'ref';
    ref.textContent = v.ref;
    p.appendChild(ref);
    el.appendChild(p);
  }
  function initVerses(){
    const wrap = document.getElementById('verseWrap');
    const el = document.createElement('div');
    el.className = 'verse';
    wrap.appendChild(el);
    renderVerseInto(el, VERSES[0]);
    requestAnimationFrame(function(){ el.classList.add('show'); });
    setInterval(function(){
      el.classList.remove('show');
      setTimeout(function(){
        verseIndex = (verseIndex+1) % VERSES.length;
        renderVerseInto(el, VERSES[verseIndex]);
        el.classList.add('show');
      }, 500);
    }, 6500);
  }

  /* ---------------- NOTES (RIGHT PANEL) ---------------- */
  function buildNotes(name){
    return NOTES_TEMPLATE.map(function(t){ return t.replace('{name}', name || 'ti'); });
  }
  function renderNoteInto(el, text){
    el.innerHTML = '';
    const p = document.createElement('p');
    p.textContent = text;
    el.appendChild(p);
    const hint = document.createElement('span');
    hint.className = 'tap-hint';
    hint.textContent = 'toca la tarjeta →';
    el.appendChild(hint);
  }
  function scheduleNoteTimer(card){
    clearInterval(noteTimerId);
    noteTimerId = setInterval(function(){ advanceNote(card, false); }, 7500);
  }
  function advanceNote(card, manual){
    card.style.opacity = '0';
    card.style.transform = 'rotate(-1.5deg) translateY(6px)';
    setTimeout(function(){
      noteIndex = (noteIndex+1) % notesArr.length;
      renderNoteInto(card, notesArr[noteIndex]);
      card.style.opacity = '1';
      card.style.transform = 'rotate(-1.5deg)';
    }, 400);
    if(manual) scheduleNoteTimer(card);
  }
  function initNotes(){
    const stackEl = document.getElementById('noteStack');
    const card = document.createElement('div');
    card.className = 'note-card';
    stackEl.appendChild(card);
    renderNoteInto(card, notesArr[0]);
    card.addEventListener('click', function(){ advanceNote(card, true); });
    scheduleNoteTimer(card);
  }

  /* ---------------- STARRY LOGIN CANVAS ---------------- */
  const canvas = document.getElementById('stars-canvas');
  const ctx = canvas.getContext('2d');
  let stars = [], shooting = [], running = true, animId = null, t = 0, shootTimer = 3;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resizeCanvas(){
    const dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function initStars(){
    resizeCanvas();
    stars = [];
    const count = Math.max(60, Math.floor((innerWidth*innerHeight)/9000));
    for(let i=0;i<count;i++){
      stars.push({
        x: Math.random()*innerWidth,
        y: Math.random()*innerHeight*0.85,
        r: 0.4 + Math.random()*1.3,
        base: 0.35 + Math.random()*0.65,
        speed: 0.4 + Math.random()*1.3,
        phase: Math.random()*Math.PI*2
      });
    }
  }
  function spawnShootingStar(){
    const x = Math.random()*innerWidth*0.6 + innerWidth*0.1;
    const y = Math.random()*innerHeight*0.25;
    const angle = Math.PI/4 + (Math.random()-0.5)*0.3;
    const speed = 9 + Math.random()*5;
    shooting.push({x:x, y:y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed, life:1});
  }
  function drawStarsFrame(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    t += 0.016;
    stars.forEach(function(s){
      const a = s.base * (0.5 + 0.5*Math.sin(t*s.speed + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(253,246,227,' + a.toFixed(2) + ')';
      ctx.fill();
    });
    shootTimer -= 0.016;
    if(shootTimer <= 0){ spawnShootingStar(); shootTimer = 4 + Math.random()*5; }
    shooting.forEach(function(s){
      s.x += s.vx; s.y += s.vy; s.life -= 0.02;
      const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx*6, s.y - s.vy*6);
      grad.addColorStop(0, 'rgba(253,246,227,' + Math.max(s.life,0).toFixed(2) + ')');
      grad.addColorStop(1, 'rgba(253,246,227,0)');
      ctx.strokeStyle = grad; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x - s.vx*6, s.y - s.vy*6); ctx.stroke();
    });
    shooting = shooting.filter(function(s){ return s.life > 0 && s.x < innerWidth+50 && s.y < innerHeight+50; });
    if(running) animId = requestAnimationFrame(drawStarsFrame);
  }
  function stopStars(){ running = false; if(animId) cancelAnimationFrame(animId); }

  initStars();
  if(reduced){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    stars.forEach(function(s){
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(253,246,227,' + s.base.toFixed(2) + ')';
      ctx.fill();
    });
  } else {
    drawStarsFrame();
  }
  window.addEventListener('resize', function(){
    const loginEl = document.getElementById('login-screen');
    if(loginEl.style.display !== 'none') initStars();
  });

  /* ---------------- LOGIN FLOW ---------------- */
  const loginForm = document.getElementById('loginForm');
  const nameInput = document.getElementById('nameInput');
  const hint = document.getElementById('loginHint');

  loginForm.addEventListener('submit', function(e){
    e.preventDefault();
    const name = nameInput.value.trim();
    if(!name){ hint.classList.add('show'); nameInput.focus(); return; }
    hint.classList.remove('show');
    userName = name;
    revealMain();
  });

  function revealMain(){
    document.title = 'Flores para ' + userName;
    document.getElementById('greetName').textContent = userName;
    const loginEl = document.getElementById('login-screen');
    loginEl.classList.add('leaving');
    setTimeout(function(){ loginEl.style.display = 'none'; stopStars(); }, 950);

    const main = document.getElementById('main-site');
    main.hidden = false;
    requestAnimationFrame(function(){ main.classList.add('entering'); });
    initMainSite();
  }

  function initMainSite(){
    if(mainInitialized) return;
    mainInitialized = true;
    renderMenu();
    renderBouquet(currentType);
    initPetalsBg();
    initVerses();
    notesArr = buildNotes(userName);
    initNotes();
    initToneControl();
  }

})();
</script>
</body>
</html>
